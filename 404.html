<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Page not found — Bone Dog Studios</title>
  <link rel="icon" type="image/png" sizes="32x32" href="/assets/img/favicon-32.png">
  <link rel="stylesheet" href="/assets/site.css">
  <style>
    /* small additions for the deep-link fallback content injected below */
    .row { display: flex; gap: 12px; justify-content: center; margin-top: 26px; flex-wrap: wrap; }
    .note { font-size: 13px; margin-top: 16px; color: var(--muted); }
    .hero-inner b { color: var(--bone); }
  </style>
</head>
<body>
  <main class="hero" style="min-height: 100svh;">
    <div class="hero-inner" id="content" style="pointer-events: auto;">
      <img class="hero-logo" src="/assets/img/bone-dog-mark.png" alt="Bone Dog Studios skeleton dog logo">
      <h1 style="font: 600 clamp(2rem, 5vw, 3rem)/1.1 var(--display); color: var(--bone);">This page buried its bone elsewhere.</h1>
      <p class="sub">The page you're after doesn't exist. Try the homepage, or the plan page.</p>
      <a class="btn" href="/">Back to Bone Dog Studios</a>
    </div>
  </main>
  <script>
    // Show an "open in app" message only for Plan connect / business links.
    // (Deep-link fallback behavior from the app-links work — do not remove.)
    var p = location.pathname || "";
    if (p.indexOf('/plan/u/') === 0 || p.indexOf('/plan/b/') === 0) {
      document.getElementById('content').innerHTML =
        '<img class="hero-logo" src="/assets/img/bone-dog-mark.png" alt="Bone Dog Studios skeleton dog logo">' +
        '<h1 style="font: 600 clamp(2rem, 5vw, 3rem)/1.1 var(--display); color: var(--bone);">Open this in the plan app</h1>' +
        '<p class="sub">You need the <b>plan</b> app to use this link. If you already have it, open plan and tap ' +
        '<b>Scan a Code</b> — or get the app below.</p>' +
        '<div class="row">' +
        '<a class="btn solid" href="https://play.google.com/store/apps/details?id=com.bonedogstudios.plan">Get plan on Google Play</a>' +
        '</div>' +
        '<p class="note">On iPhone, plan is currently in TestFlight beta.</p>';
    }
  </script>
</body>
</html>
