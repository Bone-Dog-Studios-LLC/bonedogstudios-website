<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Open in Plan</title>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background:#0f1115; color:#e8ecf2; display:flex; min-height:100vh; margin:0;
      align-items:center; justify-content:center; text-align:center; padding:24px; }
    .card { max-width:440px; }
    h1 { font-size:22px; margin:0 0 12px; }
    p { color:#9aa6b2; line-height:1.6; }
    b { color:#e8ecf2; }
    .row { display:flex; gap:12px; justify-content:center; margin-top:22px; flex-wrap:wrap; }
    a.btn { background:#6ea8fe; color:#0f1115; text-decoration:none; font-weight:700;
      padding:12px 18px; border-radius:10px; }
    .note { font-size:13px; margin-top:14px; }
  </style>
</head>
<body>
  <div class="card" id="content">
    <h1>Page not found</h1>
    <p>This link isn’t available on the web.</p>
  </div>
  <script>
    // Show an "open in app" message only for Plan connect / business links.
    var p = location.pathname || "";
    if (p.indexOf('/plan/u/') === 0 || p.indexOf('/plan/b/') === 0) {
      document.getElementById('content').innerHTML =
        '<h1>Open this in the Plan app</h1>' +
        '<p>You need the <b>Plan</b> app to use this link. If you already have it, open Plan and tap ' +
        '<b>Scan a Code</b> — or get the app below.</p>' +
        '<div class="row">' +
        '<a class="btn" href="https://play.google.com/store/apps/details?id=com.bonedogstudios.plan">Get Plan on Google Play</a>' +
        '</div>' +
        '<p class="note">On iPhone, Plan is currently in TestFlight beta.</p>';
    }
  </script>
</body>
</html>
